<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>操作日志 · 系统管理 · 无人机低空智慧调度平台</title>
<style>
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --fg:#1A2333; --muted:#5A6B85; --border:#E2E8F2;
  --navy-900:#0B1B33; --navy-800:#12294A; --navy-700:#1E3A61;
  --blue-600:#1F6FEB; --blue-400:#4C9AFF;
  --alert-red:#E5484D; --warn-orange:#F76B15; --caution-yellow:#F5A623;
  --safe-green:#30A46C; --info-cyan:#3DD9EB;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg); color:var(--fg);
  font-family:"Source Han Sans SC","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.num{font-family:"DIN Alternate","Bahnschrift","SF Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
button{font-family:inherit; cursor:pointer; background:none; border:none; color:inherit; font-size:inherit}
a{color:var(--blue-600); text-decoration:none}
:focus-visible{outline:2px solid var(--blue-600); outline-offset:2px; border-radius:2px}
::placeholder{color:#9AA9C2}

/* ===== 左侧深色导航 ===== */
.layout{display:flex; min-height:100vh}
.sidenav{width:232px; flex:none; background:var(--navy-900); color:#EAF1FB; display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh}
.nav-logo{display:flex; align-items:center; gap:10px; padding:18px 16px; border-bottom:1px solid rgba(76,154,255,.18); color:#EAF1FB}
.nav-logo:hover{background:rgba(76,154,255,.08)}
.nav-logo .t1{font-size:15px; font-weight:700; letter-spacing:1px}
.nav-logo .t2{font-size:11px; color:#8FA3C4; margin-top:2px}
.nav-menu{padding:12px 10px; display:flex; flex-direction:column; gap:2px}
.nav-item{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:6px;
  font-size:14px; color:#B9C8E0; transition:background .15s,color .15s}
.nav-item:hover{background:rgba(76,154,255,.12); color:#EAF1FB}
.nav-item.active{background:var(--blue-600); color:#fff; font-weight:600}
.nav-item svg{flex:none}
.nav-foot{margin-top:auto; padding:14px 16px; font-size:11px; color:#5E7295; border-top:1px solid rgba(76,154,255,.14); line-height:1.7}

/* ===== 主列 ===== */
.main{flex:1; min-width:0; display:flex; flex-direction:column}
.topbar{height:56px; flex:none; background:var(--surface); border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between; padding:0 24px; position:sticky; top:0; z-index:20}
.crumb{font-size:14px; color:var(--muted)}
.crumb b{color:var(--fg); font-weight:600}
.crumb .sep{margin:0 8px; color:#C3CEDF}
.top-right{display:flex; align-items:center; gap:18px}
.top-search{display:flex; align-items:center; gap:6px; background:var(--bg); border:1px solid var(--border);
  border-radius:6px; padding:0 10px; height:32px; width:220px; color:var(--muted)}
.top-search input{border:none; background:none; outline:none; flex:1; font-size:13px; color:var(--fg); font-family:inherit}
.bell{position:relative; width:34px; height:34px; border-radius:6px; display:flex; align-items:center; justify-content:center; color:var(--muted)}
.bell:hover{background:var(--bg); color:var(--fg)}
.bell .badge{position:absolute; top:2px; right:2px; min-width:16px; height:16px; border-radius:8px; background:var(--alert-red);
  color:#fff; font-size:10px; display:flex; align-items:center; justify-content:center; padding:0 4px; font-weight:600}
.top-time{font-size:13px; color:var(--muted)}
.top-user{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--fg)}
.top-user .avatar{width:30px; height:30px; border-radius:50%; background:var(--navy-700); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600}

/* ===== 内容区 ===== */
.content{flex:1; padding:20px 24px 32px; min-width:0}
.page-head{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:16px; flex-wrap:wrap}
.page-head h1{font-size:20px; font-weight:700; line-height:1.4}
.page-head .sub{font-size:12px; color:var(--muted); margin-top:3px}
.seg{display:flex; background:var(--surface); border:1px solid var(--border); border-radius:6px; overflow:hidden}
.seg button, .seg a{height:34px; padding:0 16px; font-size:13px; color:var(--muted); display:inline-flex; align-items:center;
  transition:background .15s,color .15s}
.seg button:hover, .seg a:hover{color:var(--fg); background:#EEF3FA}
.seg button.on, .seg a.on{background:var(--navy-700); color:#fff; font-weight:600}

.toolbar{display:flex; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap}
.select, .input{height:34px; border:1px solid var(--border); border-radius:6px; background:var(--surface);
  font-size:13px; color:var(--fg); padding:0 10px; font-family:inherit; transition:border-color .15s}
.select:hover, .input:hover{border-color:#C7D3E6}
.select:focus, .input:focus{outline:none; border-color:var(--blue-600); box-shadow:0 0 0 2px rgba(31,111,235,.15)}
.input{width:220px}
.btn{height:34px; padding:0 14px; border-radius:6px; font-size:13px; display:inline-flex; align-items:center; gap:6px;
  transition:all .15s; border:1px solid transparent}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none}
.btn-primary{background:var(--blue-600); color:#fff; font-weight:600}
.btn-primary:hover{background:#1A63D4}
.btn-outline{border-color:var(--border); color:var(--fg); background:var(--surface)}
.btn-outline:hover{border-color:var(--blue-600); color:var(--blue-600); background:#F2F7FF}
.spacer{flex:1}

/* ===== 指标卡 ===== */
.metric-grid{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:16px}
.metric-card{background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:14px 16px;
  display:flex; align-items:center; gap:12px; transition:box-shadow .15s, border-color .15s}
.metric-card:hover{border-color:#C3D2E8; box-shadow:0 2px 8px rgba(11,27,51,.08)}
.metric-card .mi{width:38px; height:38px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex:none}
.metric-card .mk{font-size:12px; color:var(--muted)}
.metric-card .mv{font-size:24px; font-weight:700; line-height:1.3}
.metric-card .mu{font-size:11px; color:var(--muted); font-weight:400; margin-left:3px}
.mi-blue{background:#E8F1FF; color:var(--blue-600)}
.mi-green{background:#E6F6EE; color:var(--safe-green)}
.mi-navy{background:#E4EDFF; color:var(--navy-700)}
.mi-yellow{background:#FFF3E3; color:var(--warn-orange)}
.mi-red{background:#FDECEC; color:var(--alert-red)}

/* ===== 表格 ===== */
.table-tools{display:flex; align-items:center; gap:12px; margin-bottom:10px; min-height:34px}
.table-info{font-size:13px; color:var(--muted)}
.table-wrap{background:var(--surface); border:1px solid var(--border); border-radius:8px; overflow-x:auto}
table{width:100%; border-collapse:collapse; min-width:960px}
th{font-size:12px; color:var(--muted); font-weight:600; text-align:left; padding:10px 12px; border-bottom:1px solid var(--border); background:#F8FAFD; white-space:nowrap}
td{font-size:13px; padding:10px 12px; border-bottom:1px solid #EEF2F8; white-space:nowrap; line-height:1.45}
tbody tr{transition:background .12s}
tbody tr:hover{background:#F7FAFF}
tbody tr:last-child td{border-bottom:none}
td.ell{max-width:260px; overflow:hidden; text-overflow:ellipsis}
.empty-row td{text-align:center; color:var(--muted); padding:34px 12px; font-size:13px}
.badge{display:inline-flex; align-items:center; gap:5px; height:22px; padding:0 8px; border-radius:11px; font-size:12px; font-weight:600}
.badge i{width:6px; height:6px; border-radius:50%; display:inline-block}
.b-online{background:#E6F6EE; color:var(--safe-green)} .b-online i{background:var(--safe-green)}
.b-offline{background:#EEF2F8; color:var(--muted)} .b-offline i{background:#8FA3C4}
.b-warn{background:#FFF3E3; color:#B25E09} .b-warn i{background:var(--caution-yellow)}
.b-fail{background:#FDECEC; color:var(--alert-red)} .b-fail i{background:var(--alert-red)}

/* ===== 日志展开详情 ===== */
.xp-btn{width:26px; height:26px; border-radius:6px; display:inline-flex; align-items:center; justify-content:center;
  color:var(--muted); transition:background .15s,color .15s}
.xp-btn:hover{background:#EEF4FF; color:var(--blue-600)}
.xp-btn svg{transition:transform .2s}
.xp-btn.open svg{transform:rotate(90deg)}
tr.detail-row td{background:#F8FAFD; padding:14px 20px; white-space:normal}
tr.detail-row:hover{background:#F8FAFD}
.detail-desc{font-size:13px; color:var(--fg); margin-bottom:10px; line-height:1.6}
.detail-meta{font-size:12px; color:var(--muted); margin-top:10px; display:flex; gap:18px; flex-wrap:wrap}
.diff-table{width:100%; max-width:720px; border:1px solid var(--border); border-radius:6px; border-collapse:separate; border-spacing:0; overflow:hidden; background:var(--surface)}
.diff-table th{font-size:12px; color:var(--muted); font-weight:600; text-align:left; padding:7px 12px; background:#F1F5FB; border-bottom:1px solid var(--border)}
.diff-table td{font-size:13px; padding:8px 12px; border-bottom:1px solid #EEF2F8; white-space:normal}
.diff-table tr:last-child td{border-bottom:none}
.chg-old{color:var(--muted)}
.chg-arrow{color:#9AA9C2; padding:0 6px}
.chg-new{color:var(--blue-600); font-weight:600}

/* ===== 分页 ===== */
.pager{display:flex; align-items:center; gap:6px; margin-top:12px; flex-wrap:wrap}
.pg-btn{min-width:30px; height:30px; padding:0 8px; border:1px solid var(--border); border-radius:6px;
  background:var(--surface); font-size:13px; color:var(--fg); display:inline-flex; align-items:center; justify-content:center;
  transition:all .15s}
.pg-btn:hover:not(:disabled):not(.on){border-color:var(--blue-600); color:var(--blue-600); background:#F2F7FF}
.pg-btn.on{background:var(--navy-700); border-color:var(--navy-700); color:#fff; font-weight:600}
.pg-btn:disabled{opacity:.45; cursor:not-allowed}
.pg-info{font-size:12px; color:var(--muted); margin-left:8px}

/* ===== Toast ===== */
#toast-box{position:fixed; top:20px; right:20px; z-index:99; display:flex; flex-direction:column; gap:8px}
.toast{background:var(--navy-800); border:1px solid var(--blue-400); border-left:4px solid var(--blue-400); color:#EAF1FB;
  border-radius:6px; padding:10px 16px; font-size:13px; box-shadow:0 6px 20px rgba(0,0,0,.35);
  animation:toastIn .2s ease-out; max-width:340px; line-height:1.5}
.toast.warn{border-color:var(--warn-orange); border-left-color:var(--warn-orange)}
.toast.err{border-color:var(--alert-red); border-left-color:var(--alert-red)}
.toast.ok{border-color:var(--safe-green); border-left-color:var(--safe-green)}
.toast.hide{animation:toastOut .25s ease-in forwards}
@keyframes toastIn{from{opacity:0; transform:translateX(20px)}to{opacity:1; transform:none}}
@keyframes toastOut{to{opacity:0; transform:translateX(20px)}}

[hidden]{display:none !important}
</style>
</head>

  <!-- ===== 主列 ===== -->
  <div class="main">
    <header class="topbar" data-od-id="topbar">
      <div class="crumb">系统管理<span class="sep">/</span><b>操作日志</b></div>
      <div class="top-right">
        <div class="top-search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>

          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>

    <div class="content">
      <div class="page-head">
        <div>
          <h1>操作日志</h1>
          <p class="sub">黔南布依族苗族自治州 · 平台全模块操作审计与追溯（数据均为演示示例）</p>
        </div>
        <nav class="seg" data-od-id="system-subnav" aria-label="系统管理二级导航">

      </div>

      <!-- ===== 统计条 ===== -->
      <div class="metric-grid" data-od-id="log-metrics">
        <div class="metric-card" data-od-id="metric-today">
          <span class="mi mi-blue"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>
          <span><span class="mk">今日操作数</span><br><span class="mv num" id="m-today">0</span><span class="mu">次</span></span>
        </div>
        <div class="metric-card" data-od-id="metric-people">
          <span class="mi mi-green"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20a7.5 7.5 0 0115 0"/></svg></span>
          <span><span class="mk">涉及人数（近 7 天）</span><br><span class="mv num" id="m-people">0</span><span class="mu">人</span></span>
        </div>
        <div class="metric-card" data-od-id="metric-alert">
          <span class="mi mi-red"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9.5 16.5H2.5L12 3z"/><path d="M12 10v4M12 17.5v.01"/></svg></span>
          <span><span class="mk">告警类操作（近 7 天）</span><br><span class="mv num" id="m-alert">0</span><span class="mu">次</span></span>
        </div>
        <div class="metric-card" data-od-id="metric-export">
          <span class="mi mi-navy"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg></span>
          <span><span class="mk">导出次数（近 7 天）</span><br><span class="mv num" id="m-export">0</span><span class="mu">次</span></span>

      <!-- ===== 筛选工具栏 ===== -->
      <div class="toolbar" data-od-id="log-filter-bar">
        <div class="seg" data-od-id="filter-range" role="group" aria-label="时间范围">

          导出 CSV

      <!-- ===== 日志表格 ===== -->
      <div class="table-wrap">
        <table data-od-id="log-table">
          <thead><tr>
            <th style="width:40px"></th><th>时间</th><th>操作人</th><th>所属单位</th>
            <th>模块</th><th>操作内容</th><th>IP 地址</th><th>级别</th>

/* ================= 状态与工具 ================= */
const NOW = new Date("2026-09-08T12:00:00");
function fmtDate(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
const TODAY = fmtDate(NOW);
const D7  = fmtDate(new Date(NOW.getTime()-6*86400000));
const D30 = fmtDate(new Date(NOW.getTime()-29*86400000));
const PAGE_SIZE = 10;
const state = {range:"7d", q:"", module:"全部", type:"全部", level:"全部", page:1, open:null};

const $ = id => document.getElementById(id);
function toast(msg, type=""){
  const box = $("toast-box");
  const el = document.createElement("div");
  el.className = "toast" + (type ? " " + type : "");
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(()=>{ el.classList.add("hide"); setTimeout(()=>el.remove(), 260); }, 3200);
}
function esc(s){const d=document.createElement("div"); d.textContent=s; return d.innerHTML;}

/* ================= 统计条 ================= */
function renderMetrics(){
  const in7 = LOGS.filter(l=>l.t.slice(0,10) >= D7);
  $("m-today").textContent  = LOGS.filter(l=>l.t.slice(0,10)===TODAY).length;
  $("m-people").textContent = new Set(in7.map(l=>l.name)).size;
  $("m-alert").textContent  = in7.filter(l=>l.level==="告警").length;
  $("m-export").textContent = in7.filter(l=>l.type==="导出").length;
}

/* ================= 筛选 ================= */
function filtered(){
  return LOGS.filter(l=>{
    const d = l.t.slice(0,10);
    if(state.range==="today" && d!==TODAY) return false;
    if(state.range==="7d"  && d<D7)  return false;
    if(state.range==="30d" && d<D30) return false;
    if(state.module!=="全部" && l.module!==state.module) return false;
    if(state.type!=="全部"  && l.type!==state.type)  return false;
    if(state.level!=="全部" && l.level!==state.level) return false;
    if(state.q){
      const q = state.q.toLowerCase();
      if(!(l.name+" "+l.unit+" "+l.content).toLowerCase().includes(q)) return false;
    }
    return true;
  });
}

/* ================= 表格渲染 ================= */
const LEVEL_CLS = {"常规":"b-offline","重要":"b-warn","告警":"b-fail"};
function rowHtml(l){
  return `<tr data-id="${l.id}">
    <td><button class="xp-btn${state.open===l.id?" open":""}" data-xp="${l.id}" aria-label="展开详情" aria-expanded="${state.open===l.id}">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button></td>
    <td class="num">${l.t}</td>
    <td>${esc(l.name)}</td>
    <td>${esc(l.unit)}</td>
    <td>${l.module}</td>
    <td class="ell" title="${esc(l.content)}">${esc(l.content)}</td>
    <td class="num">${l.ip}</td>
    <td><span class="badge ${LEVEL_CLS[l.level]}"><i></i>${l.level}</span></td>
  </tr>`;
}
function detailHtml(l){
  let chg = "";
  if(l.changes && l.changes.length){
    chg = `<table class="diff-table">
      <thead><tr><th style="width:180px">变更字段</th><th>变更前 → 变更后</th></tr></thead>
      <tbody>${l.changes.map(c=>`<tr><td>${esc(c[0])}</td><td><span class="chg-old">${esc(c[1])}</span><span class="chg-arrow">→</span><span class="chg-new">${esc(c[2])}</span></td></tr>`).join("")}</tbody>
    </table>`;
  }
  return `<tr class="detail-row"><td colspan="8">
    <div class="detail-desc">${esc(l.desc)}</div>
    ${chg}
    <div class="detail-meta">
      <span>操作类型：${l.type}</span><span>结果：<b style="color:var(--safe-green)">成功</b></span>
      <span>来源 IP：${l.ip}（公安网内网）</span><span>会话编号：SES-${l.t.slice(0,10).replace(/-/g,"")}-${String(l.id).padStart(3,"0")}</span>
    </div>
  </td></tr>`;
}
function renderTable(){
  const list = filtered();
  const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  if(state.page > pages) state.page = pages;
  const start = (state.page-1)*PAGE_SIZE;
  const slice = list.slice(start, start+PAGE_SIZE);
  const tb = $("log-tbody");
  if(!slice.length){
    tb.innerHTML = `<tr class="empty-row"><td colspan="8">暂无符合筛选条件的操作日志，请调整时间范围或筛选条件</td></tr>`;
  }else{
    let html = "";
    slice.forEach(l=>{ html += rowHtml(l); if(state.open===l.id) html += detailHtml(l); });
    tb.innerHTML = html;
  }
  $("log-count").textContent = `共 ${list.length} 条`;
  renderPager(list.length, pages);
}

/* ================= 分页 ================= */
function renderPager(total, pages){
  const p = state.page;
  let btns = `<button class="pg-btn" data-pg="prev" ${p<=1?"disabled":""}>上一页</button>`;
  for(let i=1;i<=pages;i++){
    btns += `<button class="pg-btn num${i===p?" on":""}" data-pg="${i}">${i}</button>`;
  }
  btns += `<button class="pg-btn" data-pg="next" ${p>=pages?"disabled":""}>下一页</button>`;
  btns += `<span class="pg-info num">每页 ${PAGE_SIZE} 条 · 第 ${p}/${pages} 页 · 共 ${total} 条</span>`;
  $("pager").innerHTML = btns;
}

/* ================= CSV 导出 ================= */
function csvCell(s){return '"' + String(s).replace(/"/g,'""') + '"';}
function exportCsv(){
  const list = filtered();
  if(!list.length){ toast("当前筛选无数据，未生成导出文件", "warn"); return; }
  const head = ["时间","操作人","所属单位","模块","操作类型","操作内容","IP 地址","级别"];
  const lines = [head.map(csvCell).join(",")];
  list.forEach(l=>lines.push([l.t,l.name,l.unit,l.module,l.type,l.content,l.ip,l.level].map(csvCell).join(",")));
  const blob = new Blob(["\uFEFF" + lines.join("\r\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  let objectUrl = "";
  try {
    if (!("download" in a) || typeof URL.createObjectURL !== "function") throw new Error("DOWNLOAD_UNAVAILABLE");
    objectUrl = URL.createObjectURL(blob);
    a.href = objectUrl;
    a.download = `操作日志_${TODAY.replace(/-/g,"")}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(objectUrl), 1000);
    toast(`已导出 ${list.length} 条操作日志（CSV）`, "ok");
  } catch (_error) {
    a.remove();
    if (objectUrl) URL.revokeObjectURL(objectUrl);
    toast("浏览器未能生成下载文件，请检查下载权限后重试", "err");
  }
}

/* ================= 事件绑定 ================= */
document.querySelectorAll("#filter-range button, [data-od-id='filter-range'] button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll("[data-od-id='filter-range'] button").forEach(b=>b.classList.remove("on"));
    btn.classList.add("on");
    state.range = btn.dataset.range; state.page = 1; state.open = null;
    renderTable();
  });
});
$("f-search").addEventListener("input", e=>{ state.q = e.target.value.trim(); state.page = 1; renderTable(); });
$("f-module").addEventListener("change", e=>{ state.module = e.target.value; state.page = 1; renderTable(); });
$("f-type").addEventListener("change",  e=>{ state.type  = e.target.value; state.page = 1; renderTable(); });
$("f-level").addEventListener("change", e=>{ state.level = e.target.value; state.page = 1; renderTable(); });
$("btn-reset").addEventListener("click", ()=>{
  state.range="7d"; state.q=""; state.module="全部"; state.type="全部"; state.level="全部"; state.page=1; state.open=null;
  $("f-search").value=""; $("f-module").value="全部"; $("f-type").value="全部"; $("f-level").value="全部";
  document.querySelectorAll("[data-od-id='filter-range'] button").forEach(b=>b.classList.toggle("on", b.dataset.range==="7d"));
  renderTable();
  toast("筛选条件已重置");
});
$("btn-export-csv").addEventListener("click", exportCsv);
$("log-tbody").addEventListener("click", e=>{
  const btn = e.target.closest("[data-xp]");
  if(!btn) return;
  const id = Number(btn.dataset.xp);
  state.open = state.open===id ? null : id;
  renderTable();
});
$("pager").addEventListener("click", e=>{
  const btn = e.target.closest("[data-pg]");
  if(!btn || btn.disabled) return;
  const v = btn.dataset.pg;
  const pages = Math.max(1, Math.ceil(filtered().length / PAGE_SIZE));
  if(v==="prev") state.page = Math.max(1, state.page-1);
  else if(v==="next") state.page = Math.min(pages, state.page+1);
  else state.page = Number(v);
  state.open = null;
  renderTable();
});
$("bell-btn").addEventListener("click", ()=>toast("当前有 5 条未读告警通知，请前往「告警线索」工作台处置（演示）"));
$("top-search-input").addEventListener("keydown", e=>{
  if(e.key==="Enter" && e.target.value.trim()) toast("全局搜索为演示功能，请使用页内筛选（演示）");
});
function tickClock(){
  const d = new Date();
  $("top-clock").textContent = String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}
tickClock(); setInterval(tickClock, 15000);

/* ================= 初始化 ================= */
renderMetrics();
renderTable();
</script>
</body>
</html>
