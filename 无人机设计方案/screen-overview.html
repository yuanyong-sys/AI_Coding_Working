<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>低空态势一张图 · 无人机低空智慧调度平台</title>
<style>
:root{
  --bg:#0B1B33; --surface:#12294A; --fg:#EAF1FB; --muted:#8FA3C4; --border:rgba(76,154,255,0.25);
  --navy-900:#0B1B33; --navy-800:#12294A; --navy-700:#1E3A61;
  --blue-600:#1F6FEB; --blue-400:#4C9AFF;
  --alert-red:#E5484D; --warn-orange:#F76B15; --caution-yellow:#F5A623;
  --safe-green:#30A46C; --info-cyan:#3DD9EB;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg); color:var(--fg);
  font-family:"Source Han Sans SC","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:14px; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
.num{font-family:"DIN Alternate","Bahnschrift","SF Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
button{font-family:inherit; cursor:pointer; background:none; border:none; color:inherit}
a{color:var(--blue-400); text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--blue-400); outline-offset:2px; border-radius:2px}

/* ===== 舞台等比缩放 ===== */
#viewport{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)}
#stage{width:1920px;height:1080px;flex:none;transform-origin:center center;display:flex;flex-direction:column;background:var(--bg);position:relative}

/* ===== 顶部标题栏 88px ===== */
.topbar{height:88px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:relative;
  background:linear-gradient(180deg, color-mix(in srgb,var(--navy-700) 55%, transparent), transparent);
  border-bottom:1px solid var(--border)}
.topbar .side{display:flex;align-items:center;gap:20px;min-width:480px}
.topbar .side.right{justify-content:flex-end}
.platform-title{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-size:32px;font-weight:700;line-height:1.3;letter-spacing:6px;color:var(--fg);white-space:nowrap}
.platform-title em{font-style:normal;color:var(--blue-400)}
.back-link{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);padding:8px 10px;border-radius:4px}
.back-link:hover{color:var(--fg);background:color-mix(in srgb,var(--blue-400) 12%, transparent);text-decoration:none}
.back-link:active{background:color-mix(in srgb,var(--blue-400) 20%, transparent)}
.meta-item{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted)}
.meta-item .num{color:var(--fg);font-size:17px}
.meta-item svg{flex:none}
.dim-switch{display:flex;border:1px solid var(--border);border-radius:4px;overflow:hidden}
.dim-switch button{height:32px;padding:0 14px;font-size:13px;color:var(--muted);background:transparent;transition:background .15s,color .15s}
.dim-switch button:hover{color:var(--fg);background:color-mix(in srgb,var(--blue-400) 14%, transparent)}
.dim-switch button:active{background:color-mix(in srgb,var(--blue-400) 22%, transparent)}
.dim-switch button.on{background:var(--blue-600);color:#fff}
.fs-btn{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;font-size:13px;color:var(--muted);
  border:1px solid var(--border);border-radius:4px;transition:all .15s}
.fs-btn:hover{color:var(--fg);background:color-mix(in srgb,var(--blue-400) 14%, transparent)}
.fs-btn:active{transform:scale(.97)}
.poc-badge{display:inline-flex;align-items:center;height:30px;padding:0 10px;border:1px solid var(--info-cyan);border-radius:4px;
  color:var(--info-cyan);background:color-mix(in srgb,var(--info-cyan) 10%, transparent);font-size:12px;font-weight:600;white-space:nowrap}
.control-btn[aria-pressed="true"]{color:#fff;background:var(--blue-600);border-color:var(--blue-400)}

/* ===== 三栏主区 ===== */
.main{flex:1;display:flex;gap:12px;padding:12px 12px 0;min-height:0}
.col{width:350px;flex:none;display:flex;flex-direction:column;gap:12px;min-height:0}
/* 350px 侧栏文字在等比例缩小值上统一放大 25%，兼顾信息密度与可读性。 */
.col .panel-title{font-size:14px}
.col .panel-more{font-size:11px}
.col .stat-label{font-size:12px}
.col .stat-value{font-size:33px}
.col .stat-value .unit{font-size:12.5px}
.col .stat-delta{font-size:11px}
.col .fleet-id{font-size:12.5px}
.col .fleet-task,.col .batt-num{font-size:11px}
.col .task-meta{font-size:12px}
.col .overdue-tag{font-size:10px}
.col .alert-level,.col .alert-loc,.col .alert-time{font-size:11px}
.col .alert-type{font-size:12px}
.col .rose-legend,.col .trend-legend{font-size:11px}
.col svg text{font-size:91%}
/* 1440×900 演示视口按 0.75 缩放，逆向补偿侧栏使其可见宽度仍为 350px。 */
@media (width:1440px) and (height:900px){.col{width:466.6667px}}
.panel{background:color-mix(in srgb,var(--navy-800) 92%, transparent);
  border:1px solid var(--border);border-radius:6px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.panel-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:10px 14px 8px}
.panel-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;line-height:1.4;color:var(--fg)}
.panel-title::before{content:"";width:4px;height:14px;background:var(--blue-400);border-radius:1px}
.panel-more{font-size:12px;color:var(--muted);padding:4px 6px;border-radius:3px}
.panel-more:hover{color:var(--fg);background:color-mix(in srgb,var(--blue-400) 12%, transparent);text-decoration:none}
.panel-more:active{background:color-mix(in srgb,var(--blue-400) 20%, transparent)}
.panel-body{flex:1;padding:0 14px 12px;min-height:0}

/* A1 指标卡 2×2 */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;height:100%}
.stat-card{background:color-mix(in srgb,var(--navy-700) 45%, transparent);border:1px solid var(--border);
  border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.stat-label{font-size:13px;color:var(--muted)}
.stat-value{font-size:36px;font-weight:700;color:var(--fg);line-height:1.1}
.stat-value .unit{font-size:14px;font-weight:400;color:var(--muted);margin-left:4px}
.stat-delta{font-size:12px;display:flex;align-items:center;gap:4px}
.stat-delta.good{color:var(--safe-green)}
.stat-delta.bad{color:var(--alert-red)}
.stat-delta .base{color:var(--muted)}

/* A2 机队列表 */
.fleet-list{display:flex;flex-direction:column;gap:6px;overflow:auto;height:100%}
.fleet-row{display:grid;grid-template-columns:14px 64px 1fr 92px;align-items:center;gap:10px;
  padding:8px 10px;border-radius:5px;border:1px solid transparent;cursor:pointer;transition:background .15s,border-color .15s;text-align:left;width:100%}
.fleet-row:hover{background:color-mix(in srgb,var(--blue-400) 10%, transparent)}
.fleet-row:active{background:color-mix(in srgb,var(--blue-400) 18%, transparent)}
.fleet-row.active{background:color-mix(in srgb,var(--blue-600) 24%, transparent);border-color:var(--blue-400)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.online{background:var(--safe-green)}
.dot.busy{background:var(--blue-400)}
.dot.alarm{background:var(--alert-red);animation:breathe 1s ease-in-out infinite}
.dot.offline{background:var(--muted);opacity:.4}
.fleet-id{font-size:14px;font-weight:600}
.fleet-task{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.batt{display:flex;align-items:center;gap:6px}
.batt-bar{flex:1;height:5px;border-radius:3px;background:color-mix(in srgb,var(--navy-900) 70%, transparent);overflow:hidden}
.batt-fill{height:100%;border-radius:3px;background:var(--safe-green)}
.batt-fill.low{background:var(--warn-orange)}
.batt-num{font-size:12px;color:var(--muted);width:34px;text-align:right}

/* A3 任务进度 */
.task-list{display:flex;flex-direction:column;gap:12px;height:100%;justify-content:center}
.task-row{display:flex;flex-direction:column;gap:5px}
.task-meta{display:flex;justify-content:space-between;font-size:13px}
.task-name{color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-pct{color:var(--blue-400);font-weight:600}
.task-row.overdue .task-pct{color:var(--warn-orange)}
.task-row.overdue .task-fill{background:var(--warn-orange)}
.task-bar{height:6px;border-radius:3px;background:color-mix(in srgb,var(--navy-900) 70%, transparent);overflow:hidden}
.task-fill{height:100%;border-radius:3px;background:var(--blue-400)}
.overdue-tag{font-size:11px;color:var(--warn-orange);border:1px solid color-mix(in srgb,var(--warn-orange) 55%, transparent);border-radius:3px;padding:0 4px;margin-left:6px}

/* ===== 中央地图区 ===== */
.map-wrap{flex:1;position:relative;min-width:0;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--navy-900)}
.map-wrap svg.gis{position:absolute;inset:0;width:100%;height:100%}
#amap-container{position:absolute;inset:0;display:none;background:var(--navy-900);overflow:hidden}
#amap-container.show{display:block}
.amap-tile{position:absolute;width:256px;height:256px;pointer-events:none;user-select:none;
  filter:grayscale(1) invert(0.92) brightness(0.9) contrast(1.08)}
#amap-container::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:color-mix(in srgb,var(--navy-900) 34%, transparent)}
.layer-ctrl{position:absolute;top:14px;left:14px;z-index:5;background:color-mix(in srgb,var(--navy-800) 92%, transparent);
  border:1px solid var(--border);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.layer-ctrl h4{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:1px}
.layer-item{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg);cursor:pointer;min-height:24px}
.layer-item input{position:absolute;opacity:0;pointer-events:none}
.layer-item:hover .switch{background:color-mix(in srgb,var(--blue-400) 35%, var(--navy-700))}
.layer-item:active .switch{filter:brightness(1.15)}
.layer-item input:checked:hover + .switch{background:color-mix(in srgb,var(--blue-600) 80%, var(--blue-400))}
.switch{width:32px;height:18px;border-radius:9px;background:var(--navy-700);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:all .15s}
.layer-item input:checked + .switch{background:var(--blue-600)}
.layer-item input:checked + .switch::after{left:16px;background:#fff}
.layer-item input:focus-visible + .switch{outline:2px solid var(--blue-400);outline-offset:2px}
.legend{position:absolute;left:14px;bottom:14px;z-index:5;background:color-mix(in srgb,var(--navy-800) 92%, transparent);
  border:1px solid var(--border);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.legend-row{display:flex;align-items:center;gap:8px}
.legend i{width:14px;height:8px;flex:none;display:inline-block}
.map-note{position:absolute;right:14px;bottom:14px;z-index:5;font-size:12px;color:var(--muted);
  background:color-mix(in srgb,var(--navy-800) 80%, transparent);border:1px solid var(--border);border-radius:4px;padding:4px 8px}

/* M4 信息卡 */
.info-card{position:fixed;top:12px;left:12px;z-index:6;width:326px;max-height:calc(100% - 24px);overflow:auto;background:color-mix(in srgb,var(--navy-800) 96%, transparent);
  border:1px solid var(--blue-400);border-radius:6px;padding:14px;display:none}
.info-card.show{display:block}
.info-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.info-title{font-size:15px;font-weight:600;line-height:1.4}
.info-close{color:var(--muted);width:28px;height:28px;border-radius:4px;display:flex;align-items:center;justify-content:center}
.info-close:hover{color:var(--fg);background:color-mix(in srgb,var(--blue-400) 14%, transparent)}
.info-close:active{background:color-mix(in srgb,var(--blue-400) 22%, transparent)}
.info-thumb{aspect-ratio:16/9;border-radius:4px;margin-bottom:10px;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--navy-700) 55%, transparent);border:1px dashed var(--border);color:var(--muted);font-size:12px;gap:6px}
.info-thumb.has-video{position:relative;overflow:hidden;border-style:solid;background:var(--navy-900)}
.info-thumb video{width:100%;height:100%;display:block;object-fit:cover}
.event-photo{position:absolute;inset:0;background-image:url('/prototype-assets/alerts/event-scenes-v1.png?v=photo-1');
  background-size:300% auto;background-repeat:no-repeat;background-color:#0b1b33;filter:saturate(.88) contrast(1.04)}
.info-video-label{position:absolute;left:8px;bottom:6px;padding:3px 6px;border-radius:3px;background:rgba(7,20,39,.82);color:var(--fg);font-size:10px;letter-spacing:.02em}
.info-video-status{display:inline-block;width:6px;height:6px;margin-right:5px;border-radius:50%;background:var(--alert-red);vertical-align:1px}
.info-row{display:flex;font-size:13px;line-height:2}
.info-row .k{width:72px;color:var(--muted);flex:none}
.info-row .v{color:var(--fg)}
.drill-link{display:inline-flex;align-items:center;gap:4px;margin-top:10px;font-size:13px;font-weight:600}

/* B1 告警流 */
.alert-list{display:flex;flex-direction:column;gap:8px;overflow:hidden;height:100%}
.alert-item{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;
  padding:8px 10px;border-radius:5px;border:1px solid var(--border);
  background:color-mix(in srgb,var(--navy-700) 35%, transparent);cursor:pointer;transition:background .15s;width:100%;text-align:left}
.alert-item:hover{background:color-mix(in srgb,var(--blue-400) 10%, transparent)}
.alert-item:active{background:color-mix(in srgb,var(--blue-400) 18%, transparent)}
.alert-item.selected{border-color:var(--info-cyan);background:color-mix(in srgb,var(--blue-600) 22%, var(--navy-700));box-shadow:inset 3px 0 0 var(--info-cyan),0 0 0 1px color-mix(in srgb,var(--info-cyan) 30%, transparent)}
.alert-item.urgent{border-color:var(--alert-red);animation:borderBreathe 1s ease-in-out infinite}
.alert-item.urgent.selected{border-color:var(--info-cyan)}
.alert-item.flash{animation:flashNew 3s ease-out forwards}
.alert-level{height:24px;border-radius:3px;font-size:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600}
.lv-red{background:var(--alert-red)} .lv-orange{background:var(--warn-orange)} .lv-yellow{background:var(--caution-yellow);color:var(--navy-900)}
.alert-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.alert-type{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.alert-loc{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alert-time{font-size:12px;color:var(--muted);white-space:nowrap}

/* B2 玫瑰图 */
.rose-wrap{display:flex;align-items:center;height:100%;gap:8px}
.rose-wrap svg{flex:none}
.rose-legend{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:12px}
.rose-legend .rl{display:flex;align-items:center;gap:6px;color:var(--muted)}
.rose-legend .rl i{width:10px;height:10px;border-radius:2px;flex:none}
.rose-legend .rl b{color:var(--fg);font-weight:600;margin-left:auto}

/* B4 趋势 */
.trend-wrap{height:100%;display:flex;flex-direction:column}
.trend-legend{display:flex;gap:16px;font-size:12px;color:var(--muted);padding:2px 0 6px}
.trend-legend i{width:14px;height:3px;display:inline-block;vertical-align:middle;margin-right:5px;border-radius:2px}

/* 底部播报条 */
.ticker{flex:none;height:44px;margin:12px;border:1px solid var(--border);border-radius:6px;
  background:color-mix(in srgb,var(--navy-800) 92%, transparent);display:flex;align-items:center;overflow:hidden}
.ticker-label{flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;font-size:13px;font-weight:600;color:var(--info-cyan);
  border-right:1px solid var(--border);height:100%}
.ticker-viewport{flex:1;overflow:hidden}
.ticker-track{display:flex;gap:64px;white-space:nowrap;animation:marquee 28s linear infinite;width:max-content}
.ticker-track span{font-size:13px;color:var(--muted)}
.ticker-track b{color:var(--fg);font-weight:600}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* 动画 */
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes borderBreathe{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--alert-red) 55%, transparent)}50%{box-shadow:0 0 0 3px color-mix(in srgb,var(--alert-red) 12%, transparent)}}
@keyframes flashNew{0%{background:color-mix(in srgb,var(--blue-600) 45%, transparent)}100%{background:color-mix(in srgb,var(--navy-700) 35%, transparent)}}
.pulse-ring{transform-box:fill-box;transform-origin:center;animation:pulse 1s ease-out infinite}
.map-selection-ring{opacity:0;transform-box:fill-box;transform-origin:center;pointer-events:none}
#layer-alerts g.selected .map-selection-ring{opacity:1;animation:selectionPulse 1.15s ease-in-out infinite}
#layer-alerts g.selected circle:last-child{stroke:#fff;stroke-width:3;filter:drop-shadow(0 0 5px var(--info-cyan))}
@keyframes pulse{0%{transform:scale(.35);opacity:.9}100%{transform:scale(2.6);opacity:0}}
@keyframes selectionPulse{0%,100%{transform:scale(.85);opacity:.95}50%{transform:scale(1.35);opacity:.35}}
.drone-hl{transform-box:fill-box;transform-origin:center;animation:pulse 1.4s ease-out infinite}

/* Toast */
#toast-box{position:fixed;top:20px;right:20px;z-index:99;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--navy-800);border:1px solid var(--blue-400);border-left:4px solid var(--blue-400);color:var(--fg);
  border-radius:6px;padding:10px 16px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.4);
  animation:toastIn .2s ease-out;max-width:320px}
.toast.hide{animation:toastOut .25s ease-in forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(20px)}}

/* SVG 图层通用 */
.map-label{font-size:12px;fill:var(--muted)}
.map-label-bright{font-size:12px;fill:var(--fg);font-weight:600}

/* 空态占位 */
.empty-tip{display:flex;align-items:center;justify-content:center;height:100%;min-height:48px;
  color:var(--muted);font-size:13px;border:1px dashed var(--border);border-radius:5px;padding:8px}

/* 地图 SVG 可聚焦点位 */
svg.gis g[tabindex]{outline:none}
svg.gis g[tabindex]:focus-visible{outline:2px solid var(--blue-400);outline-offset:3px}

/* 降级动画：尊重系统减弱动态效果设置 */
@media (prefers-reduced-motion: reduce){
  .ticker-track{animation:none}
  .pulse-ring,.drone-hl{animation:none;opacity:0}
  .dot.alarm,.alert-item.urgent,.alert-item.flash{animation:none}
  .toast,.toast.hide{animation:none}
}
.visual-test *{animation:none!important;transition:none!important}
</style>
</head>
<body data-page="overview" data-api="/api/state">
<div id="viewport">
<div id="stage" data-od-id="screen-stage" data-flight-speed="0.35" data-idle-tour-ms="60000" data-tour-state="idle">

  <!-- ===== 顶部标题栏 ===== -->
  <header class="topbar" data-od-id="screen-topbar">
    <div class="side">
      <a class="back-link" href="/" target="_top" data-od-id="back-to-index">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        返回概览
      </a>
      <span class="poc-badge badge">POC 演示数据</span>
      <div class="dim-switch" data-od-id="dim-switch" role="tablist" aria-label="时间维度">
        <button class="on" data-dim="day" role="tab" aria-selected="true">今日</button>
        <button data-dim="week" role="tab" aria-selected="false">本周</button>
        <button data-dim="month" role="tab" aria-selected="false">本月</button>
      </div>
    </div>
    <h1 class="platform-title">无人机<em>低空智慧调度</em>平台</h1>
    <div class="side right">
      <span class="meta-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span class="num" id="clock">--:--:--</span>

}

/* ---- Toast ---- */

}

/* ---- A1 指标卡 ---- */
function renderStats(dim){
  const d = DATA.stats[dim];
  $("a1-title").textContent = d.title;
  $("stat-grid").innerHTML = d.cards.map(c =>{
    /* 告警类指标上升为不利（红），业务规模类指标上升为正常（绿） */
    const favorable = c.label.indexOf("告警") >= 0 ? c.dir === "down" : c.dir === "up";
    return '<div class="stat-card">'+
      '<span class="stat-label">'+c.label+'</span>'+
      '<span class="stat-value num">'+c.value+'<span class="unit">'+c.unit+'</span></span>'+
      '<span class="stat-delta '+(favorable?"good":"bad")+'">'+(c.dir==="up"?"▲":"▼")+' '+c.delta+
      ' <span class="base">'+c.base+'</span></span>'+
    '</div>';}).join("");
}

    btn.classList.add("on");
    btn.setAttribute("aria-selected","true");
    renderStats(btn.dataset.dim);
    renderChartsForDimension(btn.dataset.dim);

/* ---- B4 近7日趋势（折线+面积填充） ---- */
function renderTrend(){
  const svg = $("trend-chart"); svg.innerHTML = "";
  const t=DATA.trend;
  if(!t.labels.length || (!t.tasks.length && !t.alerts.length)){
    const tx=document.createElementNS(NS,"text");
    tx.setAttribute("x",220); tx.setAttribute("y",80);
    tx.setAttribute("text-anchor","middle"); tx.setAttribute("class","map-label");
    tx.textContent="暂无趋势数据"; svg.appendChild(tx);
    return;
  }
  const W=440, H=150, padL=30, padR=10, padT=12, padB=22;
  const iw=W-padL-padR, ih=H-padT-padB;
  const maxV=Math.max(...t.tasks, ...t.alerts, 1)+2;
  const X = i => padL + iw*i/(t.labels.length-1);
  const Y = v => padT + ih*(1-v/maxV);
  [0, maxV/2, maxV].forEach(v => {
    const ln=document.createElementNS(NS,"line");
    ln.setAttribute("x1",padL); ln.setAttribute("x2",W-padR);
    ln.setAttribute("y1",Y(v)); ln.setAttribute("y2",Y(v));
    ln.setAttribute("stroke",cssVar("--border")); ln.setAttribute("stroke-dasharray","3 4");
    svg.appendChild(ln);
    const tx=document.createElementNS(NS,"text");
    tx.setAttribute("x",4); tx.setAttribute("y",Y(v)+4);
    tx.setAttribute("class","map-label num"); tx.textContent=Math.round(v);
    svg.appendChild(tx);
  });
  t.labels.forEach((lb,i) => {
    const tx=document.createElementNS(NS,"text");
    tx.setAttribute("x",X(i)); tx.setAttribute("y",H-6);
    tx.setAttribute("text-anchor","middle"); tx.setAttribute("class","map-label num");
    tx.textContent=lb; svg.appendChild(tx);
  });
  const area=document.createElementNS(NS,"path");
  area.setAttribute("d", "M"+X(0)+","+Y(t.tasks[0])+" "+
    t.tasks.map((v,i)=>"L"+X(i)+","+Y(v)).join(" ")+
    " L"+X(t.tasks.length-1)+","+Y(0)+" L"+X(0)+","+Y(0)+" Z");
  area.setAttribute("fill", cssVar("--blue-400")); area.setAttribute("fill-opacity","0.14");
  svg.appendChild(area);
  [[t.tasks, cssVar("--blue-400"), 2.4],[t.alerts, cssVar("--warn-orange"), 2]].forEach(([arr,col,wd]) => {
    const pl=document.createElementNS(NS,"polyline");
    pl.setAttribute("points", arr.map((v,i)=>X(i)+","+Y(v)).join(" "));
    pl.setAttribute("fill","none"); pl.setAttribute("stroke",col);
    pl.setAttribute("stroke-width",wd); pl.setAttribute("stroke-linejoin","round");
    svg.appendChild(pl);
    arr.forEach((v,i) => {
      const dot=document.createElementNS(NS,"circle");
      dot.setAttribute("cx",X(i)); dot.setAttribute("cy",Y(v)); dot.setAttribute("r",3);
      dot.setAttribute("fill",col); dot.setAttribute("stroke",cssVar("--navy-900"));
      svg.appendChild(dot);
    });
  });
}

/* ---- 高德栅格瓦片底图（无 Key 时的默认真实底图） ---- */
function lngLatToTilePixel(lng, lat, z){
  const n = Math.pow(2, z), rad = lat*Math.PI/180;
  return [(lng+180)/360*n*256, (1-Math.log(Math.tan(rad)+1/Math.cos(rad))/Math.PI)/2*n*256];
}
function initRasterTiles(){
  const host = $("amap-container"), wrap = host.parentElement;
  const W = wrap.clientWidth, H = wrap.clientHeight; /* host 初始 display:none，量父容器 */
  if(!W || !H){ setTimeout(initRasterTiles, 300); return; }
  const Z = 9, TILE = 256, max = Math.pow(2, Z) - 1;
  const [cx, cy] = lngLatToTilePixel(MAP_CENTER[0], MAP_CENTER[1], Z);
  const x0 = cx - W/2, y0 = cy - H/2;
  let shown = false, settled = 0;
  const tiles = [];
  for(let tx = Math.floor(x0/TILE); tx <= Math.floor((x0+W)/TILE); tx++){
    for(let ty = Math.floor(y0/TILE); ty <= Math.floor((y0+H)/TILE); ty++){
      if(tx<0 || ty<0 || tx>max || ty>max) continue;
      tiles.push([tx, ty]);
    }
  }
  tiles.forEach(([tx, ty]) => {
      const img = document.createElement("img");
      img.className = "amap-tile"; img.alt = ""; img.draggable = false;
      img.referrerPolicy = "no-referrer";
      img.src = "https://webrd0"+((tx+ty)%4+1)+".is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x="+tx+"&y="+ty+"&z="+Z;
      img.style.left = (tx*TILE - x0)+"px";
      img.style.top  = (ty*TILE - y0)+"px";
      /* 全部瓦片就绪/失败且无一成功时，明确标注底图加载失败并保留风格化示意图 */
      const settle = () => {
        if(++settled === tiles.length && !shown){
          const note = document.querySelector(".map-note");
          if(note) note.textContent = "高德瓦片底图加载失败 · 已回退为风格化示意图（非真实地理数据）";
        }
      };
      img.onerror = () => { img.remove(); settle(); };
      img.onload = () => {
        settle();
        if(shown) return; shown = true;
        host.classList.add("show");
        /* 隐藏示意底图与示意路网，保留围栏/航线/告警/无人机业务覆盖层 */
        const bg = $("map-bg-rect"); if(bg) bg.style.display = "none";
        ["layer-roads","layer-road-names"].forEach(id => { const g = $(id); if(g) g.style.display = "none"; });
        const roadInput = document.querySelector('input[data-layer="layer-roads"]');
        if(roadInput){ roadInput.checked = false; roadInput.disabled = true;
          roadInput.closest(".layer-item").style.opacity = ".45";
          roadInput.closest(".layer-item").title = "路网已由高德底图提供"; }
        document.querySelector(".map-note").textContent = "底图 © 高德地图（栅格瓦片 · 演示用途）· 业务点位为示例数据";
      };
      host.appendChild(img);
  });
}

/* ---- 高德 JS API 底图（配置 Key 后启用矢量底图） ---- */
let amap = null, amapRoadBase = null;
const amapDroneMarkers = {}; /* fleet 索引 -> CircleMarker，用于模拟飞行同步 */
const amapOverlays = { "layer-drones":[], "layer-alerts":[], "layer-routes":[], "layer-fences":[], "layer-roads":[] };
function offsetLngLat(lng, lat, dx, dy){ return [lng + dx/95, lat + dy/111]; } /* 约 1km 单位偏移 */
function initAMap(){
  if(!AMAP_KEY) return;
  window._AMapSecurityConfig = { securityJsCode: AMAP_SECRET };
  const s = document.createElement("script");
  s.src = "https://webapi.amap.com/maps?v=2.0&key=" + encodeURIComponent(AMAP_KEY);
  s.onload = () => {
    try{
      amap = new AMap.Map("amap-container", {
        mapStyle:"amap://styles/darkblue", viewMode:"2D",
        zoom:9, center:MAP_CENTER, zooms:[7,13]
      });
      $("amap-container").style.display = "block";
      document.querySelector(".map-wrap svg.gis").style.display = "none";
      document.querySelector(".map-note").textContent = "底图 © 高德地图 · 示例业务数据";
      /* 重点区域围栏 */
      [[0.4,0.6],[ -0.7,-0.3],[0.5,-0.7]].forEach((o,i) => {
        const c = offsetLngLat(MAP_CENTER[0], MAP_CENTER[1], o[0], o[1]);
        const poly = new AMap.Polygon({
          path:[[c[0]-0.014,c[1]-0.010],[c[0]+0.014,c[1]-0.010],[c[0]+0.014,c[1]+0.010],[c[0]-0.014,c[1]+0.010]],
          strokeColor:"#3DD9EB", strokeWeight:1.6, strokeStyle:"dashed",
          fillColor:"#3DD9EB", fillOpacity:0.06, zIndex:6
        });
        poly.setMap(amap); amapOverlays["layer-fences"].push(poly);
      });
      /* 任务航线 */
      [[[-1.2,-1.0],[-0.2,0.1],[0.9,0.9]],[[-1.0,1.0],[0.1,-0.2],[1.0,-1.1]]].forEach(path => {
        const pl = new AMap.Polyline({
          path:path.map(p => offsetLngLat(MAP_CENTER[0],MAP_CENTER[1],p[0],p[1])),
          strokeColor:"#3DD9EB", strokeWeight:2, strokeStyle:"dashed", zIndex:7
        });
        pl.setMap(amap); amapOverlays["layer-routes"].push(pl);
      });
      /* 告警点位 */
      const lvColor = { red:"#E5484D", orange:"#F76B15", yellow:"#F5A623" };
      DATA.alerts.forEach((a,i) => {
        const pos = offsetLngLat(MAP_CENTER[0], MAP_CENTER[1], (a.x-470)/300, (420-a.y)/300);
        const m = new AMap.CircleMarker({ center:pos, radius:7, strokeColor:"#0B1B33",
          strokeWeight:2, fillColor:lvColor[a.level], fillOpacity:1, zIndex:9 });
        m.on("click", () => selectAlert(i, false));
        m.setMap(amap); amapOverlays["layer-alerts"].push(m);
      });
      /* 无人机点位 */
      DATA.fleet.forEach((d,i) => {
        if(d.status==="offline") return;
        const pos = offsetLngLat(MAP_CENTER[0], MAP_CENTER[1], (d.x-470)/300, (420-d.y)/300);
        const col = d.status==="alarm" ? "#E5484D" : d.status==="busy" ? "#4C9AFF" : "#30A46C";
        const m = new AMap.CircleMarker({ center:pos, radius:6, strokeColor:"#0B1B33",
          strokeWeight:2, fillColor:col, fillOpacity:1, zIndex:10 });
        m.on("click", () => selectDrone(i, false));
        m.setMap(amap); amapOverlays["layer-drones"].push(m); amapDroneMarkers[i] = m;
      });
    }catch(e){ /* 加载失败时保留风格化示意图回退 */ }
  };
  s.onerror = () => toast("高德底图加载失败，已切换为风格化示意图");
  document.head.appendChild(s);
}

/* ---- 无人机安全区域内模拟飞行 ---- */
const FENCE_RECTS = [ /* 与 layer-fences 围栏一致的安全区域 */
  {x:560, y:110, w:270, h:180}, /* 都匀城区段 */
  {x:120, y:470, w:240, h:200}, /* 福泉贵定段 */
  {x:620, y:640, w:240, h:180}  /* 独山荔波段 */
];
function svgToLngLat(x, y){ return offsetLngLat(MAP_CENTER[0], MAP_CENTER[1], (x-470)/300, (420-y)/300); }
const FLIGHT_SPEED_FACTOR = 0.35; /* 演示飞行降至原速度的 35%，避免点位移动过快 */
function initFlightSim(){
  const plan = [];
  DATA.fleet.forEach((d, i) => {
    if(d.status === "offline") return;
    d.ox = d.x; d.oy = d.y; /* 记录初始坐标用于 SVG 位移 */
    if(d.status === "alarm"){ /* 告警处置中：绕事件点盘旋跟拍 */
      plan.push({ i, mode:"orbit", cx:d.x, cy:d.y, r:22, a:Math.random()*Math.PI*2 });
      return;
    }
    /* 在线/任务中：分配最近的安全区域，在围栏内巡航 */
    let best = 0, bd = Infinity;
    FENCE_RECTS.forEach((f, fi) => {
      const dx = d.x-(f.x+f.w/2), dy = d.y-(f.y+f.h/2), dd = dx*dx+dy*dy;
      if(dd < bd){ bd = dd; best = fi; }
    });
    const f = FENCE_RECTS[best], pad = 18;
    plan.push({ i, mode:"roam", f, pad, sp:14+Math.random()*8,
      tx:f.x+pad+Math.random()*(f.w-2*pad), ty:f.y+pad+Math.random()*(f.h-2*pad) });
  });
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let last = performance.now();
  (function tick(now){
    const dt = Math.min((now-last)/1000, 0.1); last = now;
    plan.forEach(p => {
      const d = DATA.fleet[p.i];
      if(p.mode === "orbit"){
        p.a += dt*0.9*FLIGHT_SPEED_FACTOR;
        d.x = p.cx + Math.cos(p.a)*p.r; d.y = p.cy + Math.sin(p.a)*p.r*0.7;
      }else{
        const dx = p.tx-d.x, dy = p.ty-d.y, dist = Math.hypot(dx, dy);
        if(dist < 4){ /* 到达航点后选取围栏内下一航点 */
          p.tx = p.f.x+p.pad+Math.random()*(p.f.w-2*p.pad);
          p.ty = p.f.y+p.pad+Math.random()*(p.f.h-2*p.pad);
        }else{
          d.x += dx/dist*p.sp*dt*FLIGHT_SPEED_FACTOR; d.y += dy/dist*p.sp*dt*FLIGHT_SPEED_FACTOR;
        }
      }
      const g = droneEls[p.i];
      if(g) g.setAttribute("transform", "translate("+(d.x-d.ox).toFixed(1)+","+(d.y-d.oy).toFixed(1)+")");
      const m = amapDroneMarkers[p.i];
      if(m) m.setCenter(svgToLngLat(d.x, d.y));
    });
    requestAnimationFrame(tick);
  })(performance.now());
}

/* ---- 紧急告警声音与无操作轮巡 ---- */
const IDLE_TOUR_MS = 60000;
let alertMuted = false, tourLocked = false, tourTimer = 0, tourCycle = 0, tourIndex = 0;
function playAlertTone(){
  if(alertMuted || !window.AudioContext) return;
  try{
    const ctx = new AudioContext(), oscillator = ctx.createOscillator(), gain = ctx.createGain();
    oscillator.frequency.value = 880; gain.gain.value = 0.035;
    oscillator.connect(gain); gain.connect(ctx.destination); oscillator.start();
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.22);
    oscillator.stop(ctx.currentTime + 0.22); oscillator.onended = () => ctx.close();
  }catch(_error){ /* 浏览器禁止自动播放时保持可视告警，不制造播放成功假象 */ }
}
function stopAutoTour(){
  clearInterval(tourCycle); tourCycle = 0; $("stage").dataset.tourState = tourLocked ? "locked" : "idle";
}
function showNextTourTarget(){
  const availableDrones = DATA.fleet.map((drone,index)=>({drone,index})).filter(item=>item.drone.status!=="offline");
  const targets = [
    ...availableDrones.map(item=>()=>selectDrone(item.index,true)),
    ...DATA.alerts.map((_alert,index)=>()=>selectAlert(index,true))
  ];
  if(!targets.length) return;
  targets[tourIndex++ % targets.length]();
}
function startAutoTour(){
  if(tourLocked) return;
  $("stage").dataset.tourState = "running"; showNextTourTarget();
  tourCycle = setInterval(showNextTourTarget, 8000);
}
function armAutoTour(){
  clearTimeout(tourTimer); stopAutoTour();
  if(!tourLocked) tourTimer = setTimeout(startAutoTour, IDLE_TOUR_MS);
}
$("mute-btn").addEventListener("click", () => {
  alertMuted = !alertMuted; $("mute-btn").setAttribute("aria-pressed", String(alertMuted));
  $("mute-btn").textContent = alertMuted ? "已静音" : "声音";
});
$("tour-lock").addEventListener("click", () => {
  tourLocked = !tourLocked; $("tour-lock").setAttribute("aria-pressed", String(tourLocked));
  $("tour-lock").textContent = tourLocked ? "已锁定" : "锁定";
  armAutoTour();
});
["pointerdown","keydown","wheel"].forEach(type => document.addEventListener(type, event => {
  if(event.isTrusted) armAutoTour();
}, {passive:true}));
window.addEventListener("poc:new-emergency-alert", event => {
  const alert = {...event.detail, level:"red"};
  DATA.alerts.unshift(alert); renderAlerts(); renderMapPoints(); selectAlert(0,true); playAlertTone();
});

/* ---- 统一持久化演示数据 ---- */
async function hydrateSharedState(){
  const response = await fetch("/api/state", {cache:"no-store"});
  if(!response.ok) throw new Error("共享演示数据加载失败");
  const state = await response.json();
  const statusMap = {ONLINE:"online",BUSY:"busy",ALARM:"alarm",OFFLINE:"offline"};
  const levelMap = {EMERGENCY:"red",IMPORTANT:"orange",INFO:"yellow"};
  DATA.fleet = state.drones.map((d,index) => ({id:String(d.id),status:statusMap[d.status]||"offline",task:String(d.task||"机库待命"),
    batt:boundedNumber(d.battery,0,0,100),x:boundedNumber(d.x,120+index*80,0,940),y:boundedNumber(d.y,180+index*70,0,944)}));
  DATA.tasks = state.tasks.slice(0,5).map(t => ({name:String(t.name),pct:boundedNumber(t.progress,0,0,100),overdue:Boolean(t.overdue)}));
  DATA.alerts = state.alerts.map((a,index) => ({id:String(a.id),level:levelMap[a.level]||"yellow",type:String(a.type),loc:String(a.location),time:String(a.time),status:String(a.status),
    x:boundedNumber(a.x,180+index*90,0,940),y:boundedNumber(a.y,180+index*70,0,944)}));
  document.querySelector(".poc-badge").title = "数据快照 " + state.snapshotVersion;
}
function showMapFailure(detail){
  let panel=$("map-failure");
  if(!panel){
    panel=document.createElement("div"); panel.id="map-failure"; panel.setAttribute("role","alert");
    panel.style.cssText="position:absolute;z-index:30;left:50%;top:18px;transform:translateX(-50%);padding:12px 16px;border:1px solid #E5484D;border-radius:6px;background:#12294a;color:#EAF1FB;text-align:center";
    panel.innerHTML='<b>地图不可用</b><div id="map-failure-detail" style="margin:6px 0;color:#8FA3C4"></div><button id="map-retry" style="padding:5px 14px;border:1px solid #4C9AFF;border-radius:4px;color:white;background:#2675df">重试地图</button>';
    document.querySelector(".map-wrap").appendChild(panel);
  }
  $("map-failure-detail").textContent=detail.reason+"；最后有效信息 "+detail.lastValid+"；业务点位保持显示";
  $("map-retry").onclick=async()=>{ await fetch(detail.retry,{method:"POST"}); panel.remove(); checkMapStatus(); };
}
async function checkMapStatus(){
  const response=await fetch("/api/map/status",{cache:"no-store"});
  if(!response.ok){ const body=await response.json(); showMapFailure(body.detail); return false; }
  return true;
}
function showDataFailure(detail){
  const panel=document.createElement("div"); panel.id="data-failure"; panel.setAttribute("role","alert");
  panel.style.cssText="position:fixed;z-index:100;left:50%;top:90px;transform:translateX(-50%);padding:12px 18px;border:1px solid #E5484D;border-radius:6px;background:#12294a;color:#EAF1FB";
  panel.innerHTML='<b>数据加载失败</b><span id="data-failure-detail" style="margin:0 12px;color:#8FA3C4"></span><button id="data-retry">重试数据</button>';
  document.body.appendChild(panel); $("data-failure-detail").textContent=detail.reason+"；最后有效信息 "+detail.lastValid+"；当前展示页面内置的最后有效数据";
  $("data-retry").onclick=async()=>{ await fetch(detail.retry,{method:"POST"}); panel.remove(); await hydrateSharedState(); renderFleet(); renderTasks(); renderAlerts(); renderMapPoints(); };
}
async function init(){
  try{ await hydrateSharedState(); }
  catch(error){
    try{ const response=await fetch("/api/state"); const body=await response.json(); showDataFailure(body.detail); }
    catch(_){ toast(error.message + "，已使用页面内置回退数据"); }
  }
  renderStats("day"); renderFleet(); renderTasks(); renderAlerts(); renderChartsForDimension("day"); renderTicker(); renderMapPoints();
  if(!VISUAL_TEST){
    initFlightSim(); armAutoTour();
    if(await checkMapStatus()){ if(AMAP_KEY){ initAMap(); } else { initRasterTiles(); } }
  }
}
init();
</script>
